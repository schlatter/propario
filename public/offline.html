<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Propario – offline</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --bg: #f2f4f3;
        --ink: #121a1b;
        --muted: #586466;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0e1314;
          --ink: #e8eeed;
          --muted: #93a0a1;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.5 system-ui,
          sans-serif;
      }
      main {
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      p {
        color: var(--muted);
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>Propario ist gerade nicht erreichbar</h1>
      <p>Keine Verbindung zum Server – vielleicht ist das VPN aus. Sobald die Verbindung steht: <a href="/">neu laden</a>.</p>
      <p lang="en">Propario can't be reached right now – no connection to the server; maybe the VPN is off. <a href="/">Reload</a> once you are connected.</p>
    </main>
  </body>
</html>
