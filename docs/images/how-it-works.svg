    .t { fill: #ffffff; font: 600 14px system-ui, -apple-system, 'Segoe UI', sans-serif; text-anchor: middle; }
    .a { stroke: #8a9597; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
